name: Create Release

# Creates the GitHub release for a push to dev or master. This runs on GitHub's
# own runners (with the built-in GITHUB_TOKEN), so it works even from sessions
# that cannot call the GitHub releases API directly (e.g. Claude Code on the web).
#
# The tag/channel is derived from package.json:
#   - push to dev    -> tag v<version>-dev  (pre-release)
#   - push to master -> tag v<version>      (stable release)
# Release notes are read from .github/releases/<tag>.md when present.

on:
  push:
    branches: [dev, master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate the release on the same checks CI runs, so a release can never be
      # cut from a tree that does not lint or typecheck.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Create release from package.json + notes file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            TAG="v${VERSION}-dev"
            PRE="--prerelease"
          else
            TAG="v${VERSION}"
            PRE=""
          fi

          # Idempotent: if the release already exists, do nothing (safe re-pushes).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          NOTES=".github/releases/${TAG}.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARG=(--notes-file "$NOTES")
          else
            echo "No notes file at $NOTES — generating notes automatically."
            NOTES_ARG=(--generate-notes)
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            $PRE \
            "${NOTES_ARG[@]}"

          echo "Created release $TAG at $GITHUB_SHA"
